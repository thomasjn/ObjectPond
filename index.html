<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObjectPond — Morphic Smalltalk in Python & WebAssembly</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1d24;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
        }

        #world-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2e3440 0%, #1e222a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #eceff4;
            transition: opacity 0.4s ease-out;
        }

        .badge-box {
            background-color: #242933;
            border: 2px solid #5e81ac;
            border-radius: 12px;
            padding: 32px 48px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
        }

        .logo-title {
            font-size: 32px;
            font-weight: 700;
            color: #88c0d0;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .logo-sub {
            font-size: 14px;
            color: #d8dee9;
            margin-bottom: 24px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #3b4252;
            border-top: 4px solid #88c0d0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status-text {
            font-size: 14px;
            color: #a3be8c;
            font-family: monospace;
            min-height: 20px;
        }

        #drag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(94, 129, 172, 0.4);
            border: 6px dashed #88c0d0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            pointer-events: none;
        }

        #drag-overlay h2 {
            color: #ffffff;
            font-size: 32px;
            font-family: monospace;
            background: rgba(30, 34, 42, 0.9);
            padding: 20px 40px;
            border-radius: 8px;
            border: 2px solid #88c0d0;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="badge-box">
            <div class="logo-title">ObjectPond 1.0</div>
            <div class="logo-sub">Pure Python Morphic & BitBlt Engine in WebAssembly</div>
            <div class="spinner"></div>
            <div id="status-text">Booting ObjectPond Virtual Machine...</div>
        </div>
    </div>

    <div id="drag-overlay">
        <h2>Drop .image file to resume snapshot</h2>
    </div>

    <canvas id="world-canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script src="vm.js"></script>
</body>
</html>
